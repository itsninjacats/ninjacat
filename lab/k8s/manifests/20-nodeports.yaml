# The doors from the host into the panel and ClickHouse. The chart's own
# Services are ClusterIP, as they should be in a real deployment; these
# select the pods by their labels.
#
# There is none for the query process: the chart's NetworkPolicy admits the
# panel's pods only. To poke it from the host:
#   kubectl --context kind-ninjacat-lab -n ninjacat-lab port-forward deploy/ninjacat-query 18081:8081
#
# The panel: kind maps NodePort 30000 to host port 8888, which is also why
# frontend.origin in ninjacat-values.yaml says 8888.
apiVersion: v1
kind: Service
metadata:
  name: panel-nodeport
  namespace: ninjacat-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: ninjacat
    app.kubernetes.io/component: frontend
  ports:
    - { name: http, port: 3000, targetPort: http, nodePort: 30000 }
---
# ClickHouse's HTTP interface: kind maps NodePort 30123 to host port 18123.
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-http
  namespace: ninjacat-lab
spec:
  type: NodePort
  selector:
    clickhouse.altinity.com/chi: ninjacat
  ports:
    - { name: http, port: 8123, targetPort: 8123, nodePort: 30123 }
