# The door from the host into the panel. The chart's own Services are
# ClusterIP, as they should be in a real deployment; this one selects the
# panel's pods by the chart's labels.
#
# There is none for the query process: the chart's NetworkPolicy admits the
# panel's pods only. To poke it from the host:
#   kubectl --context kind-ninjacat-lab -n ninjacat-lab port-forward deploy/ninjacat-query 18081:8081
#
# The panel: kind maps NodePort 30000 to host port 8888, which is also why
# frontend.origin in ninjacat-values.yaml says 8888.
apiVersion: v1
kind: Service
metadata:
  name: panel-nodeport
  namespace: ninjacat-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: ninjacat
    app.kubernetes.io/component: frontend
  ports:
    - { name: http, port: 3000, targetPort: http, nodePort: 30000 }
