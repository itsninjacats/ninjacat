# NinjaCat — development stack.
#
#   docker compose up            everything
#   docker compose up -d postgres clickhouse   just the databases, if you run the apps on the host
#
# The server is the Rust one (backend/): one image, one program per intake host, plus the query
# process and the monitor service. `docker compose up --build` rebuilds it after a change; the
# panel reloads on save through Vite's dev server.
#
# Agents send to :8080, where Traefik sends each host name to its program (dev/intake-routes.yml),
# as the chart's ingress does on a cluster. Logs over TCP go to :10516.
#
# Databases and the query process publish on 127.0.0.1 only. The databases have passwords, the
# query process asks for a token the panel signs (backend/README.md shows how to mint one for
# curl); exposing either on 0.0.0.0 is a separate decision — drop the prefix if you mean to make it.

name: ninjacat

x-server-environment: &server-environment
  DATABASE_URL: postgres://root:mysecretpassword@postgres:5432/local
  CLICKHOUSE_HTTP_ADDR: clickhouse:8123
  CLICKHOUSE_DB: ninjacat
  CLICKHOUSE_USER: ninjacat
  CLICKHOUSE_PASSWORD: ninjacat

# One intake program: the same image, environment and order of start for every host.
x-intake: &intake
  image: ninjapaws:dev
  restart: unless-stopped
  environment:
    <<: *server-environment
    NINJACAT_ADDR: ":8080"
  depends_on:
    schema: { condition: service_completed_successfully }
    migrate: { condition: service_completed_successfully }

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.6.5
    container_name: ninjacat-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"   # HTTP / JDBC
      - "127.0.0.1:9000:9000"   # native protocol
    environment:
      CLICKHOUSE_DB: ninjacat
      CLICKHOUSE_USER: ninjacat
      CLICKHOUSE_PASSWORD: ninjacat
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    # No docker-entrypoint-initdb.d mount: the server owns the schema, and `schema` applies its
    # migrations (backend/schema). CLICKHOUSE_DB above still creates the (empty) database.
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "-u", "ninjacat", "--password", "ninjacat", "-q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    container_name: ninjacat-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      # 18+ keeps data in a version-specific subdirectory and wants the
      # parent mounted, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: brings the Postgres schema up to date, then exits. Everything
  # that needs the schema waits for it to finish, so a fresh clone works
  # without a manual step.
  migrate:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ninjacat-migrate
    command: ["bun", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://root:mysecretpassword@postgres:5432/local
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # One-shot: applies the ClickHouse migrations and the metrics retention, then exits. The
  # programs wait for it; the image every server service runs is built here.
  schema:
    build:
      context: ./backend
      # Unoptimised: the dev stack rebuilds on every change, and the optimiser's time is for
      # the images that are deployed.
      args:
        PROFILE: dev
    image: ninjapaws:dev
    container_name: ninjacat-schema
    command: ["ninjapaws_migrate"]
    environment:
      <<: *server-environment
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: "no"

  # What agents send to: each host name to its program.
  intake:
    image: traefik:v3.5.3
    container_name: ninjacat-intake
    restart: unless-stopped
    command:
      - --entrypoints.intake.address=:8080
      - --providers.file.filename=/etc/traefik/intake-routes.yml
    ports:
      - "8080:8080"     # reachable from agent machines
    volumes:
      - ./dev/intake-routes.yml:/etc/traefik/intake-routes.yml:ro

  intake-app:
    <<: *intake
    container_name: ninjacat-intake-app
    command: ["ninjapaws_app"]

  intake-api:
    <<: *intake
    container_name: ninjacat-intake-api
    command: ["ninjapaws_api"]

  intake-trace:
    <<: *intake
    container_name: ninjacat-intake-trace
    command: ["ninjapaws_trace"]

  intake-telemetry:
    <<: *intake
    container_name: ninjacat-intake-telemetry
    command: ["ninjapaws_telemetry"]

  intake-resources:
    <<: *intake
    container_name: ninjacat-intake-resources
    command: ["ninjapaws_resources"]

  intake-logs:
    <<: *intake
    container_name: ninjacat-intake-logs
    command: ["ninjapaws_logs"]
    ports:
      - "10516:10516"   # logs over TCP, for agents with force_use_tcp

  intake-profile:
    <<: *intake
    container_name: ninjacat-intake-profile
    command: ["ninjapaws_profile"]

  intake-debugger:
    <<: *intake
    container_name: ninjacat-intake-debugger
    command: ["ninjapaws_debugger"]

  intake-sourcemap:
    <<: *intake
    container_name: ninjacat-intake-sourcemap
    command: ["ninjapaws_sourcemap"]

  intake-browser:
    <<: *intake
    container_name: ninjacat-intake-browser
    command: ["ninjapaws_browser"]

  intake-processes:
    <<: *intake
    container_name: ninjacat-intake-processes
    command: ["ninjapaws_processes"]

  intake-kubeops:
    <<: *intake
    container_name: ninjacat-intake-kubeops
    command: ["ninjapaws_kubeops"]

  intake-containers:
    <<: *intake
    container_name: ninjacat-intake-containers
    command: ["ninjapaws_containers"]

  intake-remote-config:
    <<: *intake
    container_name: ninjacat-intake-remote-config
    command: ["ninjapaws_remote_config"]

  intake-dbm:
    <<: *intake
    container_name: ninjacat-intake-dbm
    command: ["ninjapaws_dbm"]

  intake-ndm:
    <<: *intake
    container_name: ninjacat-intake-ndm
    command: ["ninjapaws_ndm"]

  intake-cws:
    <<: *intake
    container_name: ninjacat-intake-cws
    command: ["ninjapaws_cws"]

  intake-runtime-security:
    <<: *intake
    container_name: ninjacat-intake-runtime-security
    command: ["ninjapaws_runtime_security"]

  intake-cspm:
    <<: *intake
    container_name: ninjacat-intake-cspm
    command: ["ninjapaws_cspm"]

  intake-sbom:
    <<: *intake
    container_name: ninjacat-intake-sbom
    command: ["ninjapaws_sbom"]

  intake-sds:
    <<: *intake
    container_name: ninjacat-intake-sds
    command: ["ninjapaws_sds"]

  intake-agent-discovery:
    <<: *intake
    container_name: ninjacat-intake-agent-discovery
    command: ["ninjapaws_agent_discovery"]

  intake-agent-health:
    <<: *intake
    container_name: ninjacat-intake-agent-health
    command: ["ninjapaws_agent_health"]

  intake-event-management:
    <<: *intake
    container_name: ninjacat-intake-event-management
    command: ["ninjapaws_event_management"]

  intake-software-inventory:
    <<: *intake
    container_name: ninjacat-intake-software-inventory
    command: ["ninjapaws_software_inventory"]

  intake-synthetics-results:
    <<: *intake
    container_name: ninjacat-intake-synthetics-results
    command: ["ninjapaws_synthetics_results"]

  intake-synthetics-poller:
    <<: *intake
    container_name: ninjacat-intake-synthetics-poller
    command: ["ninjapaws_synthetics_poller"]

  intake-data-obs:
    <<: *intake
    container_name: ninjacat-intake-data-obs
    command: ["ninjapaws_data_obs"]

  intake-ci-test-cycle:
    <<: *intake
    container_name: ninjacat-intake-ci-test-cycle
    command: ["ninjapaws_ci_test_cycle"]

  intake-ci-test-coverage:
    <<: *intake
    container_name: ninjacat-intake-ci-test-coverage
    command: ["ninjapaws_ci_test_coverage"]

  intake-ci-webhook:
    <<: *intake
    container_name: ninjacat-intake-ci-webhook
    command: ["ninjapaws_ci_webhook"]

  intake-ai-usage:
    <<: *intake
    container_name: ninjacat-intake-ai-usage
    command: ["ninjapaws_ai_usage"]

  intake-llm-obs:
    <<: *intake
    container_name: ninjacat-intake-llm-obs
    command: ["ninjapaws_llm_obs"]

  intake-install:
    <<: *intake
    container_name: ninjacat-intake-install
    command: ["ninjapaws_install"]

  # What the panel reads from: the panel's and the query API. It only reads. Its port asks for
  # the panel's token, not for an API key, and is published on the loopback alone; the panel's
  # container reaches it over the compose network.
  internal:
    image: ninjapaws:dev
    container_name: ninjacat-internal
    command: ["ninjapaws_internal"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *server-environment
      NINJACAT_INTERNAL_ADDR: ":8081"
      # The same on the frontend: it signs, this checks.
      NINJACAT_QUERY_TOKEN_SECRET: dev-only-query-token-secret-change-me-32ch
    depends_on:
      schema: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }

  # The monitor service. Replicas share the monitors through Postgres advisory locks; here there
  # is one.
  monitors:
    image: ninjapaws:dev
    container_name: ninjacat-monitors
    command: ["ninjapaws_monitors"]
    restart: unless-stopped
    environment:
      <<: *server-environment
    depends_on:
      schema: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ninjacat-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      DATABASE_URL: postgres://root:mysecretpassword@postgres:5432/local
      # The panel talks to the query process, never to the agent intake.
      NINJACAT_INTERNAL_URL: http://internal:8081
      ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: dev-only-secret-change-me-in-production-32ch
      NINJACAT_QUERY_TOKEN_SECRET: dev-only-query-token-secret-change-me-32ch
    volumes:
      - ./frontend:/app
      # Named volumes shadow the bind mount, so the container keeps its own
      # Linux-built node_modules even if the host has none (or has macOS ones).
      - frontend-node-modules:/app/node_modules
      - frontend-svelte-kit:/app/.svelte-kit
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  clickhouse-data:
  clickhouse-logs:
  pgdata:
  frontend-node-modules:
  frontend-svelte-kit:
