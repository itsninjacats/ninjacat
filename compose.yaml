# NinjaCat — development stack.
#
#   docker compose up            everything, with hot reload
#   docker compose up -d postgres clickhouse   just the databases, if you run the apps on the host
#
# The application services rebuild themselves on save: the server's two
# processes through `dotnet watch`, the panel through Vite's dev server. Source is bind-mounted,
# so an edit on the host is an edit in the container.
#
# Databases and the query process publish on 127.0.0.1 only. The databases
# have passwords, the query process asks for nothing at all; exposing either
# on 0.0.0.0 is a separate decision — drop the prefix if you mean to make it.

name: ninjacat

x-server-environment: &server-environment
  DATABASE_URL: postgres://root:mysecretpassword@postgres:5432/local
  CLICKHOUSE_HTTP_ADDR: clickhouse:8123
  CLICKHOUSE_DB: ninjacat
  CLICKHOUSE_USER: ninjacat
  CLICKHOUSE_PASSWORD: ninjacat
  NINJACAT_ARTIFACTS_PATH: /artifacts
  # Polling, because inotify events do not cross the bind mount everywhere.
  DOTNET_USE_POLLING_FILE_WATCHER: "true"
  # The .NET SDK reports its own usage to Microsoft unless told not to.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # The image presets port 8080 for ASP.NET; the server names its own ports
  # (NINJACAT_ADDR, NINJACAT_INTERNAL_ADDR), and would warn at every start
  # that it overrides the preset.
  ASPNETCORE_HTTP_PORTS: ""

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.6.5
    container_name: ninjacat-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"   # HTTP / JDBC
      - "127.0.0.1:9000:9000"   # native protocol
    environment:
      CLICKHOUSE_DB: ninjacat
      CLICKHOUSE_USER: ninjacat
      CLICKHOUSE_PASSWORD: ninjacat
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    # No docker-entrypoint-initdb.d mount: the server owns the schema and
    # applies its embedded migrations at startup (api/schema). The
    # entrypoint mechanism only ever fired on an empty data directory anyway.
    # CLICKHOUSE_DB above still creates the (empty) database itself.
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "-u", "ninjacat", "--password", "ninjacat", "-q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    container_name: ninjacat-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      # 18+ keeps data in a version-specific subdirectory and wants the
      # parent mounted, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: brings the Postgres schema up to date, then exits. Everything
  # that needs the schema waits for it to finish, so a fresh clone works
  # without a manual step.
  migrate:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ninjacat-migrate
    command: ["bun", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://root:mysecretpassword@postgres:5432/local
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # The server is one program run as two processes, so that what agents can
  # reach and what the panel reads from share neither a port nor a container.
  # Both rebuild on save through `dotnet watch`, each into its own volume:
  # two builds of the same tree must not write the same files.

  # What agents send to. It owns every write to ClickHouse and its schema.
  intake:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: ninjacat-intake
    restart: unless-stopped
    working_dir: /app
    command: ["dotnet", "watch", "--project", "src/Server", "run", "--non-interactive", "--", "intake"]
    ports:
      - "8080:8080"     # reachable from agent machines
      - "10516:10516"   # logs over TCP, for agents with force_use_tcp
    environment:
      <<: *server-environment
      NINJACAT_ADDR: ":8080"
      NINJACAT_CAPTURE_DIR: /data/captures
      DEBUG: "true"
    volumes:
      - ./api:/app
      - ./api/captures:/data/captures
      # Build output lives here, not in the bind mount (see NINJACAT_ARTIFACTS_PATH),
      # so host and container builds never collide.
      - intake-artifacts:/artifacts
      - nuget-cache:/root/.nuget/packages
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # What the panel reads from: the panel's and the query API. It only reads.
  # Nothing on its port asks for a key, so it is published on the loopback
  # alone; the panel's container reaches it over the compose network.
  query:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: ninjacat-query
    restart: unless-stopped
    working_dir: /app
    command: ["dotnet", "watch", "--project", "src/Server", "run", "--non-interactive", "--", "query"]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *server-environment
      NINJACAT_INTERNAL_ADDR: ":8081"
    volumes:
      - ./api:/app
      - query-artifacts:/artifacts
      - nuget-cache:/root/.nuget/packages
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ninjacat-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      DATABASE_URL: postgres://root:mysecretpassword@postgres:5432/local
      # The panel talks to the query process, never to the agent intake.
      NINJACAT_INTERNAL_URL: http://query:8081
      ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: dev-only-secret-change-me-in-production-32ch
    volumes:
      - ./frontend:/app
      # Named volumes shadow the bind mount, so the container keeps its own
      # Linux-built node_modules even if the host has none (or has macOS ones).
      - frontend-node-modules:/app/node_modules
      - frontend-svelte-kit:/app/.svelte-kit
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  clickhouse-data:
  clickhouse-logs:
  pgdata:
  frontend-node-modules:
  frontend-svelte-kit:
  intake-artifacts:
  query-artifacts:
  nuget-cache:
