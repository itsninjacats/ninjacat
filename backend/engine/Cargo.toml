[package]
name = "ninjapaws-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
futures = "0.3"
ninjapaws-anomaly.workspace = true
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
winnow = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
