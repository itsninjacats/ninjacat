[workspace]
resolver = "3"
members = ["anomaly", "api", "cli", "engine", "proto", "protogen"]
# protogen runs only when asked: cargo run -p protogen
default-members = ["anomaly", "api", "engine", "proto"]

[workspace.dependencies]
ninjapaws-anomaly = { path = "anomaly" }
ninjapaws-engine = { path = "engine" }
ninjapaws-proto = { path = "proto" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
