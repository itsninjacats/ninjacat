[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
clickhouse = "0.15.3"
deadpool-postgres = "0.14.2"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
ninjapaws-engine.workspace = true
ninjapaws-intake.workspace = true
ninjapaws-proto.workspace = true
ninjapaws-storage.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tako-rs = "2.5.0"
tokio = { version = "1.54.0", features = ["full"] }
tokio-postgres = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[dev-dependencies]
http = "1"
http-body-util = "0.1"
