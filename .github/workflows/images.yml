# Builds the server and panel images and publishes them to GHCR.
#
# Images land at:
#   ghcr.io/itsninjacats/ninjacat/server
#   ghcr.io/itsninjacats/ninjacat/frontend
#
# Built from ${{ github.repository }} rather than hardcoded, so a fork
# publishes to the fork's own namespace instead of failing on permissions.

name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A second push to the same branch makes the first build irrelevant. Tags are
  # never cancelled — a release build that vanishes mid-run is worse than a
  # slow one.
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: ./server
          - name: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build to prove the Dockerfile still works, but publish
      # nothing: a fork's PR has no write access, and an unreviewed image in
      # the registry is not something to hand people.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only, deliberately. The server needs CGO, so an arm64 image
          # means either a cross toolchain in the Dockerfile or QEMU emulation
          # that turns a two-minute build into twenty. Add linux/arm64 here when
          # something actually needs it.
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
