# ClickHouse do zabawy i jako magazyn dla ninjacata.
#
# Porty sa zbindowane na 127.0.0.1 - baza ma ustawione haslo, ale wystawianie
# jej na 0.0.0.0 to osobna decyzja. Zeby wpuscic ruch z innych maszyn, zdejmij
# prefiks "127.0.0.1:" z portow.
#
#   docker compose up -d
#   docker compose exec clickhouse clickhouse-client -u ninjacat --password ninjacat -d ninjacat
#   curl 'http://localhost:8123/?user=ninjacat&password=ninjacat' -d 'SELECT version()'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.6.5
    container_name: ninjacat-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"   # HTTP / JDBC
      - "127.0.0.1:9000:9000"   # protokol natywny
    environment:
      CLICKHOUSE_DB: ninjacat
      CLICKHOUSE_USER: ninjacat
      CLICKHOUSE_PASSWORD: ninjacat
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "-u", "ninjacat", "--password", "ninjacat", "-q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  clickhouse-data:
  clickhouse-logs:
