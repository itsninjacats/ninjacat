{{- if not .Values.secrets.existingSecret }}
{{- if lt (len (.Values.secrets.betterAuthSecret | toString)) 32 }}
{{- fail "secrets.betterAuthSecret must be at least 32 characters (openssl rand -hex 32), or set secrets.existingSecret" }}
{{- end }}
{{- if lt (len (.Values.secrets.queryTokenSecret | toString)) 32 }}
{{- fail "secrets.queryTokenSecret must be at least 32 characters (openssl rand -hex 32), or set secrets.existingSecret" }}
{{- end }}
{{- if eq (.Values.secrets.queryTokenSecret | toString) (.Values.secrets.betterAuthSecret | toString) }}
{{- fail "secrets.queryTokenSecret must differ from secrets.betterAuthSecret: the query process must not be able to sign panel sessions" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ninjacat.secretName" . }}
  labels:
    {{- include "ninjacat.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required (or set secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
  CLICKHOUSE_PASSWORD: {{ required "secrets.clickhousePassword is required (or set secrets.existingSecret)" .Values.secrets.clickhousePassword | quote }}
  {{- if .Values.clickhouse.queryUser }}
  CLICKHOUSE_QUERY_PASSWORD: {{ required "secrets.clickhouseQueryPassword is required when clickhouse.queryUser is set" .Values.secrets.clickhouseQueryPassword | quote }}
  {{- end }}
  {{- if .Values.clickhouse.monitorsUser }}
  CLICKHOUSE_MONITORS_PASSWORD: {{ required "secrets.clickhouseMonitorsPassword is required when clickhouse.monitorsUser is set" .Values.secrets.clickhouseMonitorsPassword | quote }}
  {{- end }}
  {{- if .Values.monitors.ownDatabaseUrl }}
  MONITORS_DATABASE_URL: {{ required "secrets.monitorsDatabaseUrl is required when monitors.ownDatabaseUrl is set" .Values.secrets.monitorsDatabaseUrl | quote }}
  {{- end }}
  BETTER_AUTH_SECRET: {{ required "secrets.betterAuthSecret is required (or set secrets.existingSecret)" .Values.secrets.betterAuthSecret | quote }}
  NINJACAT_QUERY_TOKEN_SECRET: {{ .Values.secrets.queryTokenSecret | quote }}
{{- end }}
