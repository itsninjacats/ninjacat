{{- $fullname := include "ninjacat.fullname" . -}}
{{- $secret := include "ninjacat.secretName" . -}}
# `ninjapaws_monitors`: evaluates the monitors. Its pods share them out through
# Postgres advisory locks; it serves nothing but its health.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-monitors
  labels:
    {{- include "ninjacat.componentLabels" (dict "ctx" . "component" "monitors") | nindent 4 }}
spec:
  replicas: {{ .Values.monitors.replicas }}
  selector:
    matchLabels:
      {{- include "ninjacat.selectorLabels" (dict "ctx" . "component" "monitors") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.monitors.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ninjacat.componentLabels" (dict "ctx" . "component" "monitors") | nindent 8 }}
        {{- with .Values.monitors.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      # The last evaluations are written before the process exits.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: monitors
          image: {{ include "ninjacat.serverImage" . | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command: ["ninjapaws_monitors"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: health
              containerPort: 8559
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-monitors
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.monitors.ownDatabaseUrl }}
                  name: {{ $secret }}
                  key: MONITORS_DATABASE_URL
                  {{- else }}
                  {{- include "ninjacat.databaseUrlRef" . | nindent 18 }}
                  {{- end }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ ternary "CLICKHOUSE_MONITORS_PASSWORD" "CLICKHOUSE_PASSWORD" (ne .Values.clickhouse.monitorsUser "") }}
            {{- with .Values.monitors.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Ready while its lock session to Postgres is up.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with .Values.monitors.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.monitors.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.monitors.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.monitors.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
