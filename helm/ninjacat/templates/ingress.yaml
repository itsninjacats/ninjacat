{{- if .Values.ingress.enabled }}
{{- $fullname := include "ninjacat.fullname" . -}}
{{- $intakeHosts := include "ninjacat.intakeHosts" . | trim | splitList "\n" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "ninjacat.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  {{- with (merge (dict) .Values.ingress.frontend.annotations .Values.ingress.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.domainRoot | quote }}
      secretName: {{ .Values.ingress.frontend.tlsSecretName | default (printf "%s-frontend-tls" $fullname) }}
  {{- end }}
  rules:
    - host: {{ .Values.domainRoot | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-frontend
                port:
                  name: http
---
# Agent intake: every product host lands on the same Service. The server
# itself picks the decoder from the Host header, so this Ingress only has to
# let the name through unchanged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-intake
  labels:
    {{- include "ninjacat.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
  {{- with (merge (dict) .Values.ingress.intake.annotations .Values.ingress.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $intakeHosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.intake.tlsSecretName | default (printf "%s-intake-tls" $fullname) }}
  {{- end }}
  rules:
    {{- range $intakeHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-server
                port:
                  name: intake
    {{- end }}
{{- end }}
