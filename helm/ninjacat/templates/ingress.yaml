{{- if .Values.ingress.enabled }}
{{- $fullname := include "ninjacat.fullname" . -}}
{{- $intakeHosts := include "ninjacat.intakeHosts" . | trim | splitList "\n" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "ninjacat.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  {{- with (merge (dict) .Values.ingress.frontend.annotations .Values.ingress.annotations (include "ninjacat.tlsAnnotations" . | fromYaml)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ (include "ninjacat.domainRoot" .) | quote }}
      secretName: {{ .Values.ingress.frontend.tlsSecretName | default (printf "%s-frontend-tls" $fullname) }}
  {{- end }}
  rules:
    - host: {{ (include "ninjacat.domainRoot" .) | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-frontend
                port:
                  name: http
---
# Agent intake: each product's host names go to the Service of the program
# that serves them (intake.programs).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-intake
  labels:
    {{- include "ninjacat.componentLabels" (dict "ctx" . "component" "intake") | nindent 4 }}
  {{- with (merge (dict) .Values.ingress.intake.annotations .Values.ingress.annotations (include "ninjacat.tlsAnnotations" . | fromYaml)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $intakeHosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.intake.tlsSecretName | default (printf "%s-intake-tls" $fullname) }}
  {{- end }}
  rules:
    {{- range $name, $program := .Values.intake.programs }}
    {{- if ne (toString $program.enabled) "false" }}
    {{- $service := printf "%s-%s" $fullname (include "ninjacat.intakeComponent" $name) }}
    {{- range (include "ninjacat.programHosts" (dict "ctx" $ "program" $program) | trim | splitList "\n") }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $service }}
                port:
                  name: intake
    {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
