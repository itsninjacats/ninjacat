{{- if .Values.migrations.enabled }}
{{- $fullname := include "ninjacat.fullname" . -}}
{{- $hookSecret := .Values.secrets.existingSecret | default (printf "%s-migrate" $fullname) -}}
{{- /* A database the chart creates exists only once the install's resources do. */ -}}
{{- $hook := ternary "post-install,pre-upgrade" "pre-install,pre-upgrade" (or .Values.postgres.create .Values.clickhouse.create) -}}
{{- /*
A pre-install hook runs before any ordinary release resource exists, the
chart's Secret and ConfigMaps included. So when the chart owns the
credentials, the Jobs get a hook Secret of their own, and their settings are
written out here rather than taken from the ConfigMaps. Everything is deleted
once the migrations succeed; on failure it stays for inspection and is
replaced on the next attempt.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-migrate
  labels:
    {{- include "ninjacat.componentLabels" (dict "ctx" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- if not .Values.postgres.create }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required (or set secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
  {{- end }}
  CLICKHOUSE_PASSWORD: {{ required "secrets.clickhousePassword is required (or set secrets.existingSecret)" .Values.secrets.clickhousePassword | quote }}
---
{{- end }}
# Postgres: users, sessions, API keys.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-migrate-pg
  labels:
    {{- include "ninjacat.componentLabels" (dict "ctx" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "ninjacat.componentLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: {{ include "ninjacat.frontendImage" . | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          command: ["node", "migrate.js"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgres.create }}
                  {{- include "ninjacat.databaseUrlRef" . | nindent 18 }}
                  {{- else }}
                  name: {{ $hookSecret }}
                  key: DATABASE_URL
                  {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
---
# ClickHouse: the telemetry tables. `ninjapaws_migrate` applies the
# migrations embedded in the server, sets the metrics retention and exits.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-migrate-ch
  labels:
    {{- include "ninjacat.componentLabels" (dict "ctx" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "ninjacat.componentLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: migrate
          image: {{ include "ninjacat.serverImage" . | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command: ["ninjapaws_migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CLICKHOUSE_HTTP_ADDR
              value: {{ include "ninjacat.clickhouseAddr" . | quote }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $hookSecret }}
                  key: CLICKHOUSE_PASSWORD
            {{- range $k, $v := include "ninjacat.retentionEnv" . | fromYaml }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
