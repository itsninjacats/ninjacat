{{- $fullname := include "ninjacat.fullname" . -}}
{{- $secret := include "ninjacat.secretName" . -}}
{{- range $name, $program := .Values.intake.programs }}
{{- if ne (toString $program.enabled) "false" }}
{{- $component := include "ninjacat.intakeComponent" $name }}
{{- $env := merge (dict) ($program.env | default dict) $.Values.intake.env }}
# `ninjapaws_{{ $name }}`: the intake of {{ include "ninjacat.programHosts" (dict "ctx" $ "program" $program) | trim | splitList "\n" | join ", " }}.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "ninjacat.componentLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  replicas: {{ $program.replicas | default $.Values.intake.replicas }}
  selector:
    matchLabels:
      {{- include "ninjacat.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when its configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if not $.Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        {{- end }}
        {{- with $.Values.intake.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ninjacat.componentLabels" (dict "ctx" $ "component" $component) | nindent 8 }}
        {{- with $.Values.intake.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      # distroless's nonroot; the kubelet can only verify runAsNonRoot against a numeric UID.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: intake
          image: {{ include "ninjacat.serverImage" $ | quote }}
          imagePullPolicy: {{ $.Values.server.image.pullPolicy }}
          command: ["ninjapaws_{{ $name }}"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: intake
              containerPort: {{ $.Values.intake.service.port }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-intake
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- include "ninjacat.databaseUrlRef" $ | nindent 18 }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: CLICKHOUSE_PASSWORD
            {{- range $k, $v := $env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with (concat ($.Values.intake.extraEnv | default list) ($program.extraEnv | default list)) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /ping
              port: intake
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: intake
            initialDelaySeconds: 10
            periodSeconds: 20
          # The root filesystem is read-only: /tmp is the one place a program may write.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with ($program.resources | default $.Values.intake.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $.Values.intake.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.intake.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.intake.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# The Ingress sends the program's hosts here.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "ninjacat.componentLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
  {{- with $.Values.intake.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $.Values.intake.service.type }}
  ports:
    - name: intake
      port: {{ $.Values.intake.service.port }}
      targetPort: intake
  selector:
    {{- include "ninjacat.selectorLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
---
{{- end }}
{{- end }}
