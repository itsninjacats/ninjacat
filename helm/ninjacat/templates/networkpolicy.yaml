{{- if .Values.networkPolicy.enabled }}
# Who may reach the query process: the panel's pods, on its one port. Without
# this any pod in the cluster could read every tenant's telemetry there.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ninjacat.fullname" . }}-query
  labels:
    {{- include "ninjacat.componentLabels" (dict "ctx" . "component" "query") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ninjacat.selectorLabels" (dict "ctx" . "component" "query") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "ninjacat.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 14 }}
      ports:
        - protocol: TCP
          port: query
{{- end }}
