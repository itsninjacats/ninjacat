apiVersion: v2
name: ninjacat
description: >-
  NinjaCat — a self-hosted observability backend. Deploys the server as one
  program per intake host, the panel's query API and the monitor service, and
  the SvelteKit panel. Postgres and ClickHouse are yours, or
  made through CloudNativePG and Altinity's operator (helm/ninjacat-operators).
