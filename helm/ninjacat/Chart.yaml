apiVersion: v2
name: ninjacat
description: >-
  NinjaCat — a drop-in Datadog replacement. Deploys the server as its two
  processes (the agents' intake and the panel's query API), the monitor
  service and the SvelteKit panel. Postgres and ClickHouse are yours, or
  made through CloudNativePG and Altinity's operator (helm/ninjacat-operators).
type: application
