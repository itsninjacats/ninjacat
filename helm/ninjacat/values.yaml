# Default values for ninjacat.

# Everything public hangs off this one name:
#
#   <domainRoot>                 the panel
#   <prefix>.<domainRoot>        agent intake, one host per Datadog product
#
# Point the agent at it with DD_SITE=<domainRoot> and it composes every intake
# hostname by itself, exactly as it does against datadoghq.com.
#
# Required: there is no name that would be right for somebody else.
domainRoot: ""

# The reverse proxies in front of the panel and the intake — the Ingress
# controller's pods — as addresses or networks (10.42.0.0/16). Only what they
# say in X-Forwarded-For is believed. Without it every request seems to come
# from the controller: RUM events carry its address as the client's, and the
# panel's sign-in limiter counts all visitors as one.
trustedProxies: []

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# -----------------------------------------------------------------------------
# External databases. The chart does not run them.
# -----------------------------------------------------------------------------

clickhouse:
  # The HTTP interface: the server speaks HTTP to ClickHouse, not the native
  # protocol on :9000.
  httpAddr: clickhouse:8123
  database: ninjacat
  user: ninjacat
  # Optional: a user for the query process alone, one that can only read
  # (GRANT SELECT ON <database>.*). Its password is the secret key
  # CLICKHOUSE_QUERY_PASSWORD. Empty means the user above.
  queryUser: ""

# Secret values. Either let the chart create the Secret from these, or set
# existingSecret to a Secret you manage yourself with the same keys:
# DATABASE_URL, CLICKHOUSE_PASSWORD, BETTER_AUTH_SECRET, and
# CLICKHOUSE_QUERY_PASSWORD when clickhouse.queryUser is set.
secrets:
  existingSecret: ""
  # postgres://user:password@host:5432/db
  databaseUrl: ""
  clickhousePassword: ""
  clickhouseQueryPassword: ""
  # At least 32 characters, high entropy: openssl rand -hex 32
  betterAuthSecret: ""

# -----------------------------------------------------------------------------
# The server: one image, run as two processes that share nothing but the
# databases. What agents can reach and what the panel reads from are separate
# pods, with separate Services.
# -----------------------------------------------------------------------------

api:
  image:
    # Where .github/workflows/ci.yml publishes. A bare `ninjacat/api` would
    # be Docker Hub's, which is someone else's namespace.
    repository: ghcr.io/itsninjacats/ninjacat/api
    pullPolicy: IfNotPresent
    # Defaults to the chart appVersion.
    tag: ""

# `ninjacat-api intake`: what agents send to. It owns every write to ClickHouse.
intake:
  # More than one is safe only with migrations.enabled (below), which takes
  # the ClickHouse migrations out of the pods' start-up.
  replicas: 1

  # The Service the Ingress targets. Switch it to LoadBalancer only if agents
  # should reach the intake without going through the Ingress.
  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  # Extra non-secret environment (NINJACAT_MAX_BODY_BYTES, NINJACAT_ACK_UNKNOWN,
  # NINJACAT_RUM_ALLOWED_ORIGINS, ...). See api/README.md.
  env: {}

  # One request may hold a 64 MiB body and as much again inflated; the rest is
  # the rows waiting to be written.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# `ninjacat-api query`: what the panel reads from. It only reads, asks for no
# key, and is never exposed: its Service is ClusterIP and no Ingress names it.
query:
  replicas: 1

  service:
    port: 8081

  env: {}

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# SvelteKit panel.
# -----------------------------------------------------------------------------

frontend:
  image:
    repository: ghcr.io/itsninjacats/ninjacat/frontend
    pullPolicy: IfNotPresent
    tag: ""

  service:
    port: 3000

  # The URL users reach the panel at. Empty means http(s)://<domainRoot>,
  # following ingress.tls.enabled. SvelteKit rejects form actions when this
  # does not match the request, and better-auth uses it as its base URL.
  origin: ""

  env: {}

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The query process asks nobody for a key, so nothing but the panel may reach
# it: a NetworkPolicy lets its port be reached from the panel's pods alone.
# It takes a network plugin that enforces policies (Cilium, Calico, kindnet);
# with one that does not, the policy is there and does nothing.
networkPolicy:
  enabled: true

# Both schemas are brought up to date before every install and upgrade, by
# hook Jobs: Postgres by the frontend image's second entrypoint
# (node migrate.js), ClickHouse by the server's (ninjacat-api migrate). The
# intake pods are then told not to migrate at start-up, so several of them
# cannot race. With this off, the intake migrates ClickHouse when it starts
# and the Postgres schema is yours to apply.
migrations:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }

# -----------------------------------------------------------------------------
# Ingress: one for the panel, one for the intake.
# -----------------------------------------------------------------------------

ingress:
  enabled: true
  className: ""
  # Applied to both Ingresses, e.g. cert-manager.io/cluster-issuer.
  annotations: {}

  # On by default, and with it plain HTTP is never served: a request over
  # HTTP is answered with a redirect to HTTPS. Passwords, session cookies and
  # agent keys travel here. The certificates are yours to provide: the two
  # Secrets named below, or cert-manager through `annotations`.
  tls:
    enabled: true

  # The redirect is the controller's to make. ingress-nginx redirects an
  # Ingress that has TLS by itself. Traefik does not: for it the chart adds a
  # redirect Middleware and a second Ingress on the HTTP entry point, and
  # keeps the real ones on the HTTPS entry point.
  traefik:
    # auto: when the cluster has Traefik's CRDs (traefik.io/v1alpha1).
    redirect: auto   # auto | true | false
    entryPoints:
      http: web
      https: websecure

  frontend:
    annotations: {}
    # Defaults to <fullname>-frontend-tls.
    tlsSecretName: ""

  intake:
    # Agent payloads are large; most controllers' default body limit is not.
    # For ingress-nginx:
    #   nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    annotations: {}
    # Defaults to <fullname>-intake-tls.
    tlsSecretName: ""
    # One host per Datadog product, prefixed onto domainRoot. The list mirrors
    # the list in api/src/Intake/Routes.fs — keep the two in sync. Explicit
    # rather than a wildcard because several hosts are two labels deep
    # (trace.agent., http-intake.logs.) and neither Ingress nor a wildcard
    # certificate matches across a dot.
    hostPrefixes:
      - app
      - api
      - trace.agent
      - http-intake.logs
      - agent-http-intake.logs
      - process
      - orchestrator
      - kubeops-intake
      - config
      - contlcycle-intake
      - contimage-intake
      - dbm-metrics-intake
      - ndm-intake
      - snmp-traps-intake
      - ndmflow-intake
      - netpath-intake
      - resources-intake
      - instrumentation-telemetry-intake
      - intake.profile
      - debugger-intake
      - sourcemap-intake
      - cws-intake
      - runtime-security-http-intake.logs
      - cspm-intake
      - sbom-intake
      - sds-intake
      - agentdiscovery-intake
      - agenthealth-intake
      - event-management-intake
      - softinv-intake
      - intake.synthetics
      - http-synthetics
      - citestcycle-intake
      - citestcov-intake
      - webhook-intake
      - data-obs-intake
      - eudm-intake
      - llmobs-intake
      # The browser SDKs (RUM, logs). Any origin may send, unless
      # NINJACAT_RUM_ALLOWED_ORIGINS (intake.env) names the ones that may.
      - browser-intake
    # Full hostnames added verbatim, e.g. Multi-Region Failover copies
    # (app.mrf.<domainRoot>) if the agent dual-ships.
    #
    # An agent given a site of your own asks for app.<site>, as listed above.
    # It prefixes its version (7-84-0-app.agent.<site>) only when the site is
    # one of Datadog's own domains (pkg/config/utils/endpoints.go, the same
    # in 7.70 to 7.84). Only an installation that answers under such a domain
    # needs "*.agent.<domain>" here.
    extraHosts: []
